name: Build V2 Final Branch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    if: github.head_ref == 'release/v2.0.0-final'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - name: Stop when final source is already present
        id: state
        shell: bash
        run: |
          if [[ -f VERSION && "$(tr -d '\r\n' < VERSION)" == "2.0.0" && -f scripts/ingest/office.py && -f tests/test_smoke.py ]]; then
            echo 'complete=true' >> "$GITHUB_OUTPUT"
          else
            echo 'complete=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Create V2 source commit from verified tree
        if: steps.state.outputs.complete != 'true'
        id: source
        shell: bash
        run: |
          set -euo pipefail
          parent=$(gh api '/repos/${{ github.repository }}/git/ref/heads/main' --jq '.object.sha')
          target=$(gh api --method POST '/repos/${{ github.repository }}/git/commits' \
            -f message='Materialize v2.0.0 verified source tree' \
            -f tree='2345dca14672b9aa7691416d6f669b762d03bcb0' \
            -f parents[]="$parent" --jq '.sha')
          git fetch origin "$target"
          git checkout --detach "$target"
      - name: Add document ingestion modules and smoke tests
        if: steps.state.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts/ingest tests
          cat > scripts/ingest/__init__.py <<'PY'
          from .office import extract_file
          __all__ = ["extract_file"]
          PY
          cat > scripts/ingest/base.py <<'PY'
          from dataclasses import dataclass, field
          from typing import Any
          from scripts.evidence.models import SourceUnit
          @dataclass
          class ExtractionResult:
              units: list[SourceUnit] = field(default_factory=list)
              status: str = "ok"
              error: str | None = None
              quality: float = 1.0
              metadata: dict[str, Any] = field(default_factory=dict)
          PY
          cat > scripts/ingest/text.py <<'PY'
          from pathlib import Path
          from typing import Any
          from scripts.evidence.models import SourceUnit
          from scripts.ingest.base import ExtractionResult
          def extract_text(path: Path, rel_path: str, role: str, source_hash: str, config: dict[str, Any]) -> ExtractionResult:
              text = path.read_text(encoding="utf-8", errors="replace")
              units=[]; block=[]; start=1; lines=text.splitlines()
              for number,line in enumerate(lines,1):
                  if line.strip():
                      if not block: start=number
                      block.append(line)
                  elif block:
                      units.append(SourceUnit(rel_path,role,f"lines:{start}-{number-1}","\n".join(block).strip(),source_hash)); block=[]
              if block: units.append(SourceUnit(rel_path,role,f"lines:{start}-{len(lines)}","\n".join(block).strip(),source_hash))
              if not units and text.strip(): units.append(SourceUnit(rel_path,role,"lines:1-1",text.strip(),source_hash))
              return ExtractionResult(units=units, quality=1.0 if units else 0.0, status="ok" if units else "unreadable")
          PY
          cat > scripts/ingest/bibliography.py <<'PY'
          import re
          from pathlib import Path
          from typing import Any
          from scripts.evidence.models import SourceUnit
          from scripts.ingest.base import ExtractionResult
          def extract_bibtex_records(path: Path):
              text=path.read_text(encoding="utf-8",errors="replace"); out=[]
              for m in re.finditer(r"@([A-Za-z]+)\s*\{\s*([^,]+),([\s\S]*?)\n\}",text,re.M):
                  fields={k.lower():v.strip().strip('{}\"') for k,v in re.findall(r"([A-Za-z]+)\s*=\s*(\{[^{}]*\}|\"[^\"]*\")",m.group(3))}
                  out.append({"type":m.group(1),"key":m.group(2).strip(),**fields})
              return out
          def extract_ris_records(path: Path):
              records=[]; current={}
              for line in path.read_text(encoding="utf-8",errors="replace").splitlines():
                  m=re.match(r"^([A-Z0-9]{2})\s*-\s*(.*)$",line)
                  if not m: continue
                  tag,value=m.groups(); current.setdefault(tag,[]).append(value.strip())
                  if tag=="ER": records.append(current); current={}
              if current: records.append(current)
              return records
          def extract_bibliography(path: Path, rel_path: str, role: str, source_hash: str, config: dict[str,Any]):
              if path.suffix.lower()=='.bib':
                  records=extract_bibtex_records(path); texts=[' | '.join([r.get('title',''),r.get('author',''),r.get('year',''),r.get('doi','')]) for r in records]; loc=[f"bib:{r.get('key',i+1)}" for i,r in enumerate(records)]
              else:
                  records=extract_ris_records(path); texts=[' | '.join(sum(r.values(),[])) for r in records]; loc=[f"record:{i}" for i in range(1,len(records)+1)]
              units=[SourceUnit(rel_path,role,l,t,source_hash,metadata={"record":r}) for l,t,r in zip(loc,texts,records) if t.strip()]
              return ExtractionResult(units=units, quality=1.0, metadata={"record_count":len(records)})
          PY
          cat > scripts/ingest/docx.py <<'PY'
          from pathlib import Path
          from typing import Any
          from scripts.evidence.models import SourceUnit
          from scripts.ingest.base import ExtractionResult
          def extract_docx(path: Path, rel_path: str, role: str, source_hash: str, config: dict[str,Any]):
              from docx import Document
              document=Document(str(path)); units=[]
              for i,p in enumerate(document.paragraphs,1):
                  if p.text.strip(): units.append(SourceUnit(rel_path,role,f"paragraph:{i}",p.text.strip(),source_hash,metadata={"kind":"paragraph"}))
              for ti,table in enumerate(document.tables,1):
                  for ri,row in enumerate(table.rows,1):
                      text=' | '.join(cell.text.strip() for cell in row.cells)
                      if text.strip(' |'): units.append(SourceUnit(rel_path,role,f"table:{ti}:row:{ri}",text,source_hash,metadata={"kind":"table"}))
              return ExtractionResult(units=units,quality=1.0 if units else 0.0,status="ok" if units else "unreadable")
          PY
          cat > scripts/ingest/xlsx.py <<'PY'
          from pathlib import Path
          from typing import Any
          from scripts.evidence.models import SourceUnit
          from scripts.ingest.base import ExtractionResult
          def extract_xlsx(path: Path, rel_path: str, role: str, source_hash: str, config: dict[str,Any]):
              import openpyxl
              workbook=openpyxl.load_workbook(path,read_only=True,data_only=False); units=[]
              for sheet in workbook.worksheets:
                  for row in sheet.iter_rows():
                      cells=[cell for cell in row if cell.value is not None]
                      if not cells: continue
                      text=' | '.join(f"{cell.coordinate}: {'='+str(cell.value) if cell.data_type=='f' else cell.value}" for cell in cells)
                      units.append(SourceUnit(rel_path,role,f"sheet:{sheet.title}!{cells[0].coordinate}:{cells[-1].coordinate}",text,source_hash,metadata={"sheet":sheet.title}))
              workbook.close(); return ExtractionResult(units=units,quality=1.0 if units else 0.0,status="ok" if units else "unreadable")
          PY
          cat > scripts/ingest/pptx.py <<'PY'
          from pathlib import Path
          from typing import Any
          from scripts.evidence.models import SourceUnit
          from scripts.ingest.base import ExtractionResult
          def extract_pptx(path: Path, rel_path: str, role: str, source_hash: str, config: dict[str,Any]):
              from pptx import Presentation
              presentation=Presentation(str(path)); units=[]
              for number,slide in enumerate(presentation.slides,1):
                  texts=[]
                  for shape in slide.shapes:
                      if getattr(shape,'has_text_frame',False): texts.extend(p.text for p in shape.text_frame.paragraphs if p.text.strip())
                      if getattr(shape,'has_table',False): texts.extend(' | '.join(cell.text for cell in row.cells) for row in shape.table.rows)
                  if texts: units.append(SourceUnit(rel_path,role,f"slide:{number}:body",'\n'.join(texts),source_hash,metadata={"slide":number}))
              return ExtractionResult(units=units,quality=1.0 if units else 0.0,status="ok" if units else "unreadable")
          PY
          cat > scripts/ingest/pdf.py <<'PY'
          from pathlib import Path
          from typing import Any
          from scripts.evidence.models import SourceUnit
          from scripts.ingest.base import ExtractionResult
          def _quality(text):
              text=text.strip(); return 0.0 if not text else min(1.0,sum(c.isalnum() or '\u4e00'<=c<='\u9fff' for c in text)/len(text)*min(1.0,len(text)/250))
          def extract_pdf(path: Path, rel_path: str, role: str, source_hash: str, config: dict[str,Any]):
              from pypdf import PdfReader
              pages=[page.extract_text() or '' for page in PdfReader(str(path)).pages]
              if not any(_quality(page)>=0.2 for page in pages) and config.get('ocr',{}).get('enabled'):
                  try:
                      import pytesseract
                      from pdf2image import convert_from_path
                      pages=[pytesseract.image_to_string(image,lang=config.get('ocr',{}).get('language','eng')) for image in convert_from_path(str(path))]
                  except Exception: pass
              units=[SourceUnit(rel_path,role,f"page:{i}",text.strip(),source_hash,quality=_quality(text),metadata={"page":i}) for i,text in enumerate(pages,1) if text.strip()]
              if not units: return ExtractionResult(status="unreadable",error="No extractable PDF text; enable OCR for scanned sources",quality=0.0)
              return ExtractionResult(units=units,quality=sum(u.quality for u in units)/len(units),metadata={"pages":len(pages)})
          PY
          cat > scripts/ingest/office.py <<'PY'
          from pathlib import Path
          from typing import Any
          from scripts.ingest.base import ExtractionResult
          from scripts.ingest.bibliography import extract_bibliography
          from scripts.ingest.pdf import extract_pdf
          from scripts.ingest.pptx import extract_pptx
          from scripts.ingest.text import extract_text
          from scripts.ingest.xlsx import extract_xlsx
          TEXT={'.txt','.md','.markdown','.csv','.tsv','.json','.jsonl','.yaml','.yml','.xml','.html','.htm'}
          BIB={'.bib','.ris','.enw'}
          def extract_file(path: Path, rel_path: str, role: str, source_hash: str, config: dict[str,Any]):
              suffix=path.suffix.lower()
              try:
                  if suffix in TEXT: return extract_text(path,rel_path,role,source_hash,config)
                  if suffix in BIB: return extract_bibliography(path,rel_path,role,source_hash,config)
                  if suffix=='.docx':
                      from scripts.ingest.docx import extract_docx
                      return extract_docx(path,rel_path,role,source_hash,config)
                  if suffix in {'.xlsx','.xlsm'}: return extract_xlsx(path,rel_path,role,source_hash,config)
                  if suffix=='.pptx': return extract_pptx(path,rel_path,role,source_hash,config)
                  if suffix=='.pdf': return extract_pdf(path,rel_path,role,source_hash,config)
                  return ExtractionResult(status='unsupported',error=f'Unsupported extension: {suffix}',quality=0.0)
              except Exception as exc: return ExtractionResult(status='error',error=f'{type(exc).__name__}: {exc}',quality=0.0)
          PY
          cat > tests/__init__.py <<'PY'
          PY
          cat > tests/test_smoke.py <<'PY'
          import tempfile
          import unittest
          from pathlib import Path
          from scripts.indexing.bm25 import tokenize, bm25_score
          from scripts.workspace import Workspace
          class SmokeTests(unittest.TestCase):
              def test_imports(self):
                  from scripts.cli import build_parser
                  from scripts.compiler import compile_with_gate
                  from scripts.ingest.office import extract_file
                  self.assertTrue(callable(build_parser) and callable(compile_with_gate) and callable(extract_file))
              def test_bm25(self):
                  q=tokenize('counselling uptake'); scores=bm25_score(q,[tokenize('counselling treatment uptake'),tokenize('unrelated')]); self.assertGreater(scores[0],scores[1])
              def test_roles(self):
                  with tempfile.TemporaryDirectory() as tmp:
                      root=Path(tmp); (root/'results').mkdir(); (root/'references').mkdir(); (root/'results'/'r.md').write_text('result'); (root/'references'/'p.txt').write_text('paper')
                      inv=Workspace(root).build_inventory(); roles={f['path']:f['role'] for f in inv['files']}; self.assertEqual(roles['results/r.md'],'study-evidence'); self.assertEqual(roles['references/p.txt'],'external-evidence')
          if __name__=='__main__': unittest.main()
          PY
          git add scripts/ingest tests
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete v2.0.0 source'
          git push --force origin HEAD:release/v2.0.0-final
