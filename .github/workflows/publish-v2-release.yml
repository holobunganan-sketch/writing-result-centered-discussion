name: Publish v2.0.0 Release

on:
  push:
    paths:
      - '.release/v2.0.0'
  pull_request:
    paths:
      - '.release/v2.0.0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate V2 source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python scripts/check_package.py
          python -m compileall -q scripts
          python -m unittest discover -s tests -v
      - name: Create tag and downloadable ZIP
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "2.0.0"
          target_sha="$(git rev-parse HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --tags --force
          git tag -f v2.0.0 "$target_sha"
          git push origin refs/tags/v2.0.0 --force
          asset="$RUNNER_TEMP/writing-result-centered-discussion-v2.0.0.zip"
          git archive --format=zip --prefix=writing-result-centered-discussion/ -o "$asset" v2.0.0
          sha256sum "$asset" | tee "$asset.sha256"
          if gh release view v2.0.0 >/dev/null 2>&1; then
            gh release upload v2.0.0 "$asset" "$asset.sha256" --clobber
            gh release edit v2.0.0 --title 'Writing Result-Centered Discussion v2.0.0' --notes-file RELEASE_NOTES_v2.0.0.md --latest
          else
            gh release create v2.0.0 "$asset" "$asset.sha256" --title 'Writing Result-Centered Discussion v2.0.0' --notes-file RELEASE_NOTES_v2.0.0.md --latest
          fi
