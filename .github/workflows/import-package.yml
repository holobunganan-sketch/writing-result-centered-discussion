name: Apply packaged upgrade

on:
  pull_request:
    paths:
      - '.payload/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - name: Verify and apply V2 source
        shell: bash
        run: |
          set -euo pipefail
          VERSION_LABEL=$(sed -n '1p' .payload/READY)
          EXPECTED_ARCHIVE_SHA=$(sed -n '2p' .payload/READY)
          cat .payload/current* | base64 --decode > /tmp/upgrade.patch.xz
          echo "${EXPECTED_ARCHIVE_SHA}  /tmp/upgrade.patch.xz" | sha256sum -c -
          xz -dc /tmp/upgrade.patch.xz | git apply --binary
          rm -rf .payload .bootstrap
          rm -f .github/workflows/import-package.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Import ${VERSION_LABEL} source"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git push origin HEAD:${{ github.head_ref }}
          else
            git push origin HEAD:${{ github.ref_name }}
          fi
