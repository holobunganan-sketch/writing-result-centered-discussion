name: Apply packaged upgrade

on:
  push:
    paths:
      - '.payload/READY'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply upgrade
        shell: bash
        run: |
          set -euo pipefail
          VERSION_LABEL=$(head -n 1 .payload/READY)
          EXPECTED_ARCHIVE_SHA=$(sed -n '2p' .payload/READY)
          (cd .payload && sha256sum -c manifest.sha256)
          cat .payload/chunk* | base64 --decode > /tmp/upgrade.patch.xz
          echo "${EXPECTED_ARCHIVE_SHA}  /tmp/upgrade.patch.xz" | sha256sum -c -
          xz -dc /tmp/upgrade.patch.xz | git apply --binary -
          rm -rf .payload .bootstrap
          rm -f .github/workflows/import-package.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Import ${VERSION_LABEL} source"
          git push
